invariants:
  - One authoritative source exists for each clinical, operational, and financial fact.
  - Canonical tenant-owned tables use tenant_id TEXT NOT NULL.
  - Canonical posted money uses integer minor units and explicit currency_code.
  - Stable application-generated public IDs are used for sync-capable entities.
  - Internal auto-increment IDs are never cross-database sync identities.
  - Generic untyped reference_id relationships are prohibited in canonical models.
  - Appointment represents planning; encounter represents actual care.
  - Service request represents an order; service event represents delivered or operationally accepted service.
  - Invoice lines reference typed service or adjustment events.
  - Collections use persisted payment allocations, never report-time proportional reconstruction.
  - Practitioner roles are explicit; referrer, performer, prescriber, and treating doctor are not inferred from each other.
  - IPD provisional billing and IPD ledger are projections, not independent financial authorities.
  - Stock truth is derived from immutable stock movements.
  - Cash custody is separate from income, expense, and accounting classification.
  - Posted clinical and financial records are corrected by addendum, cancellation, reversal, credit, refund, or adjustment rather than hard deletion.
  - Ambiguous historical records enter an exception queue and are never guessed.
  - Financial cutover requires zero unexplained variance.
  - Initial migrations are additive and do not drop or rename production tables.
  - Production export, staging clone, restore rehearsal, reconciliation, and rollback evidence precede every cutover wave.
  - The local server remains disconnected until canonical cloud stabilization and CDB-110 approval.

