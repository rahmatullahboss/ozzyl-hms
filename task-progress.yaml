decisions:
  - id: D001
    date: 2026-07-13
    decision: Redesign the complete HMS data architecture rather than patch only dashboard queries.
    reason: The defects originate from overlapping clinical operational and financial sources of truth.
  - id: D002
    date: 2026-07-13
    decision: Use expand shadow backfill reconcile cutover retire migration waves.
    reason: Production data must remain available and reversible while canonical facts are proven.
  - id: D003
    date: 2026-07-13
    decision: Keep Cloudflare D1 during logical redesign.
    reason: Combining domain cleanup with a database-engine migration would multiply risk.
  - id: D004
    date: 2026-07-13
    decision: Promote encounters as actual-care authority and keep appointments as scheduling authority.
    reason: Planned care and delivered care have different lifecycles.
  - id: D005
    date: 2026-07-13
    decision: Introduce clean canonical service events rather than silently broadening visit_services.
    reason: Existing visit_services contains generic references roles and REAL monetary fields.
  - id: D006
    date: 2026-07-13
    decision: Persist payment allocations.
    reason: Service collections and invoice due must not be reconstructed proportionally in reports.
  - id: D007
    date: 2026-07-13
    decision: Treat IPD provisional billing and ledger as rebuildable projections.
    reason: They currently duplicate charge and payment truth.
  - id: D008
    date: 2026-07-13
    decision: Use explicit practitioner roles for treating ordering prescribing referring performing reporting and approving.
    reason: Generic doctor IDs caused unassigned and inconsistent commission/reporting behavior.
  - id: D009
    date: 2026-07-13
    decision: For the current no-LIS workflow non-cancelled diagnostic order items are operationally countable while result workflow remains separate.
    reason: The hospital does not currently require LIS result completion to recognize the ordered test operationally.
  - id: D010
    date: 2026-07-13
    decision: Keep the local server disconnected until cloud canonical cutover and versioned sync rehearsal are complete.
    reason: Old local schemas must not write incompatible or ambiguous records into the redesigned cloud model.
  - id: D011
    date: 2026-07-13
    decision: Select and verify staging or rehearsal databases by exact UUID rather than by database name alone.
    reason: The configured staging UUID and the current remote same-name staging database UUID have drifted.
  - id: D012
    date: 2026-07-13
    decision: Do not reuse the existing restore-drill database for canonical rehearsal until its ownership contents and retention purpose are independently verified.
    reason: Reusing an unknown clone could contaminate evidence or overwrite another recovery exercise.
  - id: D013
    date: 2026-07-13
    decision: Treat the 4 orphan-FK waivers and 14 cyclic/self-reference waivers as clone-import compatibility exceptions only.
    reason: CDB-012 must preserve exact source schema/FK truth from the original production export/local snapshot and must not interpret rehearsal import waivers as approval to omit future canonical production constraints.
  - id: D014
    date: 2026-07-13
    decision: Do not restart the full canonical program as an immediate D1-to-PostgreSQL rewrite, but require a PostgreSQL feasibility gate before CDB-020 reserves or applies the first canonical physical migration.
    reason: PostgreSQL is likely the stronger long-term centralized enterprise authority, while combining engine migration with all logical cleanup would multiply cutover risk. New canonical code must remain engine-portable until the measured gate is approved.
  - id: D015
    date: 2026-07-13
    decision: Reconcile the three pending production migration filenames through a protected rehearsal-first Wrangler pack because their main schema already existed outside the migration ledger.
    reason: Original 0422 failed against the exact snapshot with duplicate-column errors and the trigger-containing 0421 file failed in Wrangler parsing; the protected pack validated existing schema, applied the one missing unique index, preserved target row counts, and recorded the migration ledger without editing historical repository SQL.
  - id: D016
    date: 2026-07-13
    decision: Proceed with the canonical redesign on Cloudflare D1 first and defer PostgreSQL evaluation until canonical models and write paths are stable and measured.
    reason: The owner explicitly selected the D1-first path. Separating logical canonicalization from a future database-engine migration reduces simultaneous cutover risk while portability rules preserve a later PostgreSQL option.
  - id: D017
    date: 2026-07-14
    decision: Govern all canonical migrations from 0423 and require exact path-and-table allowances for writes to registered legacy authorities.
    reason: Canonical invariants must fail the build before drift ships, while current legacy compatibility must be explicit, owner-bound, phase-bound, non-wildcard, and removable rather than silently grandfathered.
  - id: D018
    date: 2026-07-14
    decision: Treat appointments as planning, visits and legacy encounters as actual-care sources, admissions as explicit inpatient episodes, and bed histories as typed intervals; proximity alone never merges clinical episodes.
    reason: Exact source keys produced deterministic encounter mappings, while proximity-only admission candidates remained ambiguous. Preserving this separation prevents no-shows, unrelated visits, admissions, and bed occupancy from becoming one inferred record.
  - id: D019
    date: 2026-07-14
    decision: Derive legacy service-price units from linked evidence, convert major-unit values exactly to integer minor units, and keep duplicate codes, linked-price differences, overlapping contexts, and changed evidence as explicit issues rather than selecting or rounding a winner.
    reason: Billing and laboratory sources use major BDT while radiology uses minor units despite similar integer columns. Evidence-based conversion and conflict queues prevent 100x price errors and silent historical rewrites.
  - id: D020
    date: 2026-07-14
    decision: Keep service requests, delivered service events, cancellations, and billing projections as separate typed facts; use explicit fulfillment quantities, practitioner roles, source evidence, and a last-event concurrency guard.
    reason: Operational requests are not proof of delivery and billing projections are not operational authorities. Typed lifecycle separation prevents duplicate fulfillment, fabricated performers, event-less service billing, and stale concurrent updates.
  - id: D021
    date: 2026-07-14
    decision: Require posted timestamps and mutually consistent terminal timestamps for posted, cancelled, and reversed invoices; constrain invoice and line math to safe integer minor units in SQL and Drizzle; classify cancelled legacy lines with rejected null mappings; and use strict backfill inserts.
    reason: These constraints prevent timestamp-free posted authority, integer overflow, cancelled rows becoming active charges, and uniqueness conflicts silently committing mappings to missing or unrelated canonical rows.
  - id: D022
    date: 2026-07-14
    decision: Treat persisted receipts, typed tenders, and explicit invoice allocations as collection authority; invoice paid or due caches and generic legacy payment references remain projections or migration evidence. Keep deposits, credits, and refunds outside CDB-060 for CDB-061.
    reason: Collection amount, payment instrument, allocation target, gateway state, cash custody, and reversal are different facts. Separating them prevents status fields or inferred proportional splits from becoming financial authority and keeps the next implementation task bounded.
  - id: D023
    date: 2026-07-14
    decision: Keep migration 0429 triggerless for remote Wrangler compatibility and enforce cross-row collection authority through row-local SQL constraints plus same-batch receipt reconciliation and stale invoice-balance CHECK guards.
    reason: Remote Wrangler atomically rejected the trigger-containing migration with incomplete input even though SQLite and local workerd accepted it. Persisted due-before/due-after evidence, conditional invoice updates, and named CHECK guards preserve exact atomic rollback without relying on unsupported remote migration triggers.
  - id: D024
    date: 2026-07-14
    decision: Treat deposits as liabilities, deposit applications and credit notes as immutable adjustment facts, refunds as outbound settlements, and payment reversals as explicit restoration facts; preserve original invoice, receipt, tender, and allocation amounts while changing only guarded projections.
    reason: Liability receipt, invoice reduction, outbound custody, allocation reversal, and practitioner compensation are distinct authorities. Separating them prevents status fields, free text, paid caches, or report-time proportions from rewriting financial history and blocks automatic reversal after compensation settlement.
  - id: D025
    date: 2026-07-14
    decision: Treat practitioner compensation rules, accrual snapshots, settlements, allocations, and adjustments as separate authorities; scope rules by explicit practitioner role and optional beneficiary, preserve unassigned performer state, and require settlement reversal before reducing paid compensation.
    reason: Performer reserve, referral commission, payable accrual, payout settlement, refund recovery, and invoice/payment reversal are different facts. Versioned rules and guarded before/after balances prevent inferred practitioners, duplicate accruals, proportional commission reconstruction, and silent rewrites of paid liabilities.
  - id: D026
    date: 2026-07-14
    decision: Treat IPD billing as a read-only projection from exact canonical admission, service, invoice, payment, deposit, adjustment, refund, reversal, and compensation facts; keep legacy provisional and ledger rows as comparison evidence; keep unapplied deposit liability separate; expose only a disabled tenant-flagged shadow route.
    reason: Independent provisional and ledger writes duplicate financial authority and can drift. One projection result for list and detail prevents duplicate charging, mixed-encounter attribution, current-price guessing, and silent active-route cutover while preserving actionable shadow differences.
  - id: D027
    date: 2026-07-14
    decision: Treat immutable typed inventory movements as stock authority, guarded tenant-item-location-lot balances as projections, unit conversion and negative-stock policy as explicit configuration, and transfers as atomic paired legs; keep mutable stock caches as reconciliation evidence and never invent historical service, invoice, or transfer links.
    reason: General inventory, rich pharmacy, and legacy medicine currently contain parallel ledgers and mutable caches. Exact source identities, integer base units, paired transfers, unique dispense/sale claims, conditional balance versions, and explicit cache variance prevent duplicate stock-out, guessed movement history, and silent balance rewrites.
  - id: D028
    date: 2026-07-14
    decision: Treat canonical accounting vouchers and entries as immutable balanced projections from exact typed outbox events; keep physical cash custody as separate immutable movements and guarded balances; require safe integer minor units, explicit account mappings, source fingerprints, open-period authority, retry/dead-letter state, and opposite reversal vouchers; never copy legacy vouchers or infer valuation, payment, liability, revenue, or expense from status fields or free text.
    reason: Domain facts, accounting classification, physical custody, retry state, and historical GL comparison are distinct authorities. Separating them prevents duplicate deposit liability, partial or unbalanced posting, stale retries, PHI leakage, guessed inventory valuation, payroll approval being treated as payment, and legacy parity differences becoming silent canonical truth.
  - id: D029
    date: 2026-07-14
    decision: Govern every KPI through a metric registry and pure read-only canonical query that declares fact source, tenant and currency scope, date basis, lifecycle filter, explicit practitioner role, quantity or amount expression, correction semantics, drill-down identity, and reconciliation owner; derive cards only from the same returned drill-down rows; prohibit query-time proportional allocation and legacy fallback; keep active executive routes unchanged until an explicitly approved parity integration or cutover.
    reason: Report cards and drill-downs currently drift because they use different SQL, ambiguous doctor roles, mixed date columns, mutable caches, and proportional payment reconstruction. A registry plus shared canonical row sets makes differences classifiable, prevents duplicate mixed-tender value and inferred service collections, and preserves production safety while canonical source domains remain unavailable.
  - id: D030
    date: 2026-07-14
    decision: Treat cutover readiness as fail-closed aggregate evidence with an exact ordered sequence, two distinct exact-UUID clone rehearsals, verified protected export and bookmarks, zero financial or integrity blockers, clean outbox and accounting queues, tenant-scoped domain flag plans, complete smoke coverage, named rollback and observation owners, and measured restore/reopen durations; expose rehearsal readiness separately from production eligibility and require fresh named-domain authorization for CDB-101.
    reason: A successful staging rehearsal is necessary but cannot authorize production. Separating rehearsal readiness from production eligibility prevents a green clone drill, stale identity, unknown migration, missing backup, failed queue, or unowned rollback from becoming an implicit production approval.

