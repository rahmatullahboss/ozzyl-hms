# Dedicated scheduled worker for LIS safety jobs.
# Do not deploy until account cron slots are consolidated and one slot is assigned
# to this worker. The main HMS worker intentionally keeps production cron disabled.
name = "hms-lis-jobs-production"
main = "src/lis-jobs.ts"
account_id = "474078d5f990169d7dadf4e1df83214a"
compatibility_date = "2026-02-17"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hms-super-admin-production-apac"
database_id = "c68a5360-a2c1-44cc-9e71-f21057bea102"
