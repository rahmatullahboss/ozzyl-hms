decisions:
  - id: D01
    date: 2026-07-13
    decision: Use a separate unassigned reserve ledger instead of nullable or dummy doctor accruals.
    reason: Existing doctor commission and settlement flows require a real doctor and should remain backward compatible.
  - id: D02
    date: 2026-07-13
    decision: Support flat and percentage rules; store percent as basis points.
    reason: Flat is required now and percentage may be needed later without another schema redesign.
  - id: D03
    date: 2026-07-13
    decision: Use unit-level reserve rows rather than mutable aggregate quantity.
    reason: Exact quantity payout, deterministic rounding, auditability, and simpler race prevention.
