invariants:
  - Persist percentage rules as basis points; 1 percent equals 100 bps.
  - Flat amount is the current operational default; percentage remains supported for future use.
  - Create one immutable reserve row per invoice-item unit.
  - Exclude tax and apply discount before performer reserve and referral commission.
  - Never trust client-supplied reserve amount, bill-paid state, doctor name, or drawer balance.
  - Never create normal performer accrual for reserve-enabled test units.
  - Only fully paid, active invoice items can be paid from Cash Operations.
  - One reserve can create at most one performer accrual and one completed settlement item.
  - Cancellation/refund cancels unpaid reserves and blocks paid reserves until payout reversal.
  - All financial writes must be tenant-scoped, idempotent, audited, and D1-batch guarded.
