name: ozzyl_health
description: Ozzyl Health — wellness-first mobile app with hospital connectivity
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Core
  ozzyl_core:
    path: ../../packages/ozzyl_core
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  get_it: ^8.0.0
  go_router: ^17.2.2
  dio: ^5.0.0
  flutter_secure_storage: ^9.0.0

  # Database & Offline
  drift: ^2.22.0
  drift_flutter: ^0.2.0
  connectivity_plus: ^6.0.0

  # Code Generation (annotations)
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  lottie: ^3.0.0
  fl_chart: ^0.70.0
  shimmer: ^3.0.0
  cached_network_image: ^3.0.0
  file_picker: ^10.3.7

  # Health & Sensors
  pedometer: ^4.0.0
  local_auth: ^2.0.0
  geolocator: ^13.0.0
  flutter_local_notifications: ^18.0.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.2.0

  # Utilities
  shared_preferences: ^2.3.0
  intl: ^0.20.0
  share_plus: ^10.0.0
  url_launcher: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.13.1
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  drift_dev: ^2.22.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.0
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/lottie/
    - assets/images/

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#0f172a"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  min_sdk_android: 21

# Splash screen configuration
flutter_native_splash:
  color: "#0f172a"
  color_dark: "#0f172a"
  image: "assets/images/splash_logo.png"
  image_dark: "assets/images/splash_logo.png"
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
