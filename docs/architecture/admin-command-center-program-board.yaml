execution:
  mode: serial_by_default
  allowed_parallelism:
    - phases:
        - ACC-02
        - ACC-03
      condition: ACC-00_and_ACC-01_are_merged_and_worktrees_are_independent
  implementation_rules:
    - dedicated_worktree_per_phase
    - run_worktree_policy_before_first_edit
    - tests_before_production_code
    - exact_file_staging_only
    - checkpoint_commit_per_task
    - no_production_mutation
  stop_conditions:
    - unexplained_reconciliation_difference
    - source_of_truth_conflict
    - migration_number_conflict
    - patient_privacy_cannot_be_enforced_server_side
    - canonical_legacy_provider_ambiguity
    - unrelated_dirty_work_cannot_be_isolated
