scope:
  included:
    - staff operational directory and status
    - shifts
    - duty roster
    - rotation patterns and staff rotations
    - tenant work calendar and holidays
    - attendance punches and daily projection
    - leave balances requests and approvals
    - biometric punch integration
    - operational overtime hours and approval
    - granular workforce permissions
    - DutyRoster and StaffPage contract hardening
  excluded:
    - canonical workforce tables
    - canonical provider activation
    - production migrations or backfills
    - legacy table retirement
    - payroll financial lifecycle changes
    - overtime monetary calculation
    - deployment push or production observation

invariants:
  - existing route URLs remain stable
  - public JSON uses camelCase
  - legacy workforce tables remain operational authority behind a module adapter
  - practitionerPublicId is nullable and never inferred
  - all mutations are tenant scoped and permission guarded
  - all roster and punch mutations define replay and conflict semantics
  - weekends are tenant policy not hardcoded Saturday and Sunday
  - raw punches are event facts and daily attendance is a projection
  - payroll consumes read-only workforce summaries only
  - no source change starts before planning documents are committed and main is synchronized

limits:
  maximum_inclusive_date_range_days: 62
  maximum_bulk_staff_shift_pairs: 50
  maximum_generated_roster_mutations: 500

