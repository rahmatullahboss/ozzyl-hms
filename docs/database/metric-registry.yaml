  "metrics": [
    {
      "metric_key": "doctor.performance.performing",
      "label": "Performed services by practitioner",
      "description": "Latest eligible canonical service-event contributions attributed only through the explicit performing role, plus exact invoice-line-only compensation authority when no service event exists.",
      "canonical_fact_source": "canonical_service_events + canonical_service_participants + canonical_invoice_lines + canonical_compensation_accruals",
      "date_basis": "service_event.occurred_at_utc converted to tenant business date; invoice-line-only compensation uses compensation_accrual.business_date",
      "status_filter": "service_event.status=posted and event_type in accepted, delivered, completed, dispensed, occupied",
      "tenant_scope": "authenticated tenant_id only",
      "practitioner_role_semantics": "participant_role=performing; referrer, prescriber, reporting, and treating identities are never substituted",
      "quantity_or_amount_expression": "one latest event per request/service/practitioner identity; sum quantity, posted invoice line_amount_minor, and matching active earned_minor",
      "refund_cancellation_reversal_rules": "cancelled and reversed service events and compensation accruals are excluded; posted invoice lines remain historical billed evidence",
      "drill_down_contract": "getCanonicalDoctorPerformance rows; card is reduced only from the returned rows",
      "reconciliation_owner": "HMS finance and clinical operations"
    },
    {
      "metric_key": "doctor.performance.referring",
      "label": "Referred services by practitioner",
      "description": "Latest eligible canonical service-event contributions attributed only through the explicit referring role, plus exact invoice-line-only compensation authority when no service event exists.",
      "canonical_fact_source": "canonical_service_events + canonical_service_participants + canonical_invoice_lines + canonical_compensation_accruals",
      "date_basis": "service_event.occurred_at_utc converted to tenant business date; invoice-line-only compensation uses compensation_accrual.business_date",
      "status_filter": "service_event.status=posted and event_type in accepted, delivered, completed, dispensed, occupied",
      "tenant_scope": "authenticated tenant_id only",
      "practitioner_role_semantics": "participant_role=referring; performer and other roles are never inferred",
      "quantity_or_amount_expression": "one latest event per request/service/practitioner identity; sum quantity, posted invoice line_amount_minor, and matching active earned_minor",
      "refund_cancellation_reversal_rules": "cancelled and reversed service events and compensation accruals are excluded",
      "drill_down_contract": "getCanonicalDoctorPerformance rows; card is reduced only from the returned rows",
      "reconciliation_owner": "HMS finance and referral operations"
    },
    {
      "metric_key": "doctor.compensation.payable_minor",
      "label": "Doctor compensation payable",
      "description": "Earned, adjusted, settled, and outstanding doctor compensation from canonical accrual snapshots.",
      "canonical_fact_source": "canonical_compensation_accruals + canonical_practitioners",
      "date_basis": "compensation_accrual.business_date",
      "status_filter": "exclude reversed accruals; payable_minor is the current outstanding authority",
      "tenant_scope": "authenticated tenant_id and separate currency totals",
      "practitioner_role_semantics": "group only by the persisted performing, referring, prescribing, or reporting role; roles are never inferred",
      "quantity_or_amount_expression": "sum earned_minor, adjusted_minor, settled_minor, and payable_minor from the same doctor-role-currency rows",
      "refund_cancellation_reversal_rules": "reversed accruals are excluded; credit-note and payout adjustments update canonical compensation lifecycle fields rather than rewriting invoice revenue",
      "drill_down_contract": "getCanonicalDoctorCompensation rows; payable cards and dashboard totals reduce only from the returned rows",
      "reconciliation_owner": "HMS finance and doctor compensation operations"
    },
    {
      "metric_key": "diagnostics.test.volume",
      "label": "Diagnostic service volume",
      "description": "Laboratory and radiology volume from the latest posted canonical event for each request/service identity.",
      "canonical_fact_source": "canonical_service_events + canonical_service_catalog_items",
      "date_basis": "service_event.occurred_at_utc converted to the tenant business date",
      "status_filter": "status=posted, item_kind laboratory or radiology, event_type accepted, delivered, or completed",
      "tenant_scope": "authenticated tenant_id only",
      "practitioner_role_semantics": "performers are displayed from explicit performing participant rows but do not multiply event volume",
      "quantity_or_amount_expression": "count one latest event per request/service or standalone event and sum its quantity",
      "refund_cancellation_reversal_rules": "cancelled/reversed rows are excluded; earlier lifecycle events for the same request/service are superseded",
      "drill_down_contract": "getCanonicalTestPerformance rows; card is reduced only from the returned rows",
      "reconciliation_owner": "HMS diagnostic operations"
    },
    {
      "metric_key": "diagnostics.test.billed_minor",
      "label": "Diagnostic billed amount",
      "description": "Posted canonical invoice-line amount linked exactly to the diagnostic event.",
      "canonical_fact_source": "canonical_service_events + canonical_invoice_lines + canonical_invoices",
      "date_basis": "service_event.occurred_at_utc converted to the tenant business date",
      "status_filter": "latest eligible posted diagnostic event with a line on a posted invoice",
      "tenant_scope": "authenticated tenant_id and separate currency totals",
      "practitioner_role_semantics": "no practitioner attribution is required for total billed amount; performer details remain explicit",
      "quantity_or_amount_expression": "sum linked line_amount_minor by currency; unlinked events remain unbilled quantity",
      "refund_cancellation_reversal_rules": "credits and refunds are separate metrics and never rewrite historical line amount",
      "drill_down_contract": "getCanonicalTestPerformance rows; card is reduced only from the returned rows",
      "reconciliation_owner": "HMS billing and diagnostic operations"
    },
    {
      "metric_key": "collections.receipts.gross_minor",
      "label": "Gross receipts",
      "description": "One contribution per canonical payment receipt regardless of tender count.",
      "canonical_fact_source": "canonical_payment_receipts + canonical_payment_tenders",
      "date_basis": "payment_receipt.business_date",
      "status_filter": "receipt status posted or reversed with captured tender evidence",
      "tenant_scope": "authenticated tenant_id and requested currency_code",
      "practitioner_role_semantics": "not applicable",
      "quantity_or_amount_expression": "sum receipt.total_minor once per receipt; tenders are nested evidence and never duplicate receipt value",
      "refund_cancellation_reversal_rules": "net_received_minor and separate refund/reversal rows expose corrections without mutating gross receipt",
      "drill_down_contract": "getCanonicalCollectionsReport contributionType=receipt; card is reduced only from returned contribution rows",
      "reconciliation_owner": "HMS billing and finance"
    },
    {
      "metric_key": "collections.allocations.service_minor",
      "label": "Persisted service-line collections",
      "description": "Collection attributed to a service only when the canonical allocation stores an exact invoice_line_public_id.",
      "canonical_fact_source": "canonical_payment_allocations + canonical_payment_receipts",
      "date_basis": "source payment_receipt.business_date",
      "status_filter": "allocation status active; use remaining_minor",
      "tenant_scope": "authenticated tenant_id and requested currency_code",
      "practitioner_role_semantics": "not applicable",
      "quantity_or_amount_expression": "sum remaining_minor only where invoice_line_public_id is persisted; invoice-only allocations remain a separate bucket",
      "refund_cancellation_reversal_rules": "reversed allocation amount is excluded through remaining_minor; query-time proportional reconstruction is prohibited",
      "drill_down_contract": "getCanonicalCollectionsReport contributionType=allocation; card is reduced only from returned contribution rows",
      "reconciliation_owner": "HMS billing and finance"
    },
    {
      "metric_key": "collections.deposit.applied_minor",
      "label": "Deposit applied",
      "description": "Patient deposit liability applied to an invoice through an explicit canonical application.",
      "canonical_fact_source": "canonical_deposit_applications + canonical_deposits",
      "date_basis": "deposit_application.applied_at_utc converted to tenant business date",
      "status_filter": "deposit application status active",
      "tenant_scope": "authenticated tenant_id and deposit currency_code",
      "practitioner_role_semantics": "not applicable",
      "quantity_or_amount_expression": "sum application.amount_minor",
      "refund_cancellation_reversal_rules": "reversed applications are excluded; deposit refunds are separate contributions",
      "drill_down_contract": "getCanonicalCollectionsReport contributionType=deposit_application; card is reduced only from returned contribution rows",
      "reconciliation_owner": "HMS billing and finance"
    },
    {
      "metric_key": "collections.refunds.minor",
      "label": "Refunds",
      "description": "Posted canonical deposit and payment refund documents.",
      "canonical_fact_source": "canonical_refunds joined to canonical_deposits or canonical_payment_receipts",
      "date_basis": "refund.business_date",
      "status_filter": "refund status posted",
      "tenant_scope": "authenticated tenant_id and resolved source currency_code",
      "practitioner_role_semantics": "not applicable",
      "quantity_or_amount_expression": "sum refund.amount_minor",
      "refund_cancellation_reversal_rules": "reversed refund rows are excluded; payment reversal remains a distinct receivable-restoration metric",
      "drill_down_contract": "getCanonicalCollectionsReport contributionType=refund; card is reduced only from returned contribution rows",
      "reconciliation_owner": "HMS billing, cash, and finance"
    },
    {
      "metric_key": "ipd.finance.admission_balance_minor",
      "label": "IPD admission balance",
      "description": "Admission balance from the established read-only canonical IPD projection.",
      "canonical_fact_source": "listCanonicalIpdAdmissionSummaries / projectCanonicalIpdAdmission",
      "date_basis": "admission.started_at_utc converted to tenant business date",
      "status_filter": "active and optionally completed canonical inpatient encounters selected by the caller",
      "tenant_scope": "authenticated tenant_id and one currency_code per report",
      "practitioner_role_semantics": "practitioner compensation is reported separately and is not a patient charge",
      "quantity_or_amount_expression": "sum projection.summary.admissionBalanceMinor from the same admission rows shown in drill-down",
      "refund_cancellation_reversal_rules": "projection already nets persisted allocations, deposit applications, credits, refunds, and payment reversals according to canonical contracts",
      "drill_down_contract": "buildCanonicalIpdFinanceReport rows; card is reduced only from the returned rows",
      "reconciliation_owner": "HMS IPD billing and finance"
    }
  ]
}
