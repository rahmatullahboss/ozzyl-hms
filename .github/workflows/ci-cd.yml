name: HMS CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: 'Run the legacy GitHub production deployment jobs'
        required: true
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Stage 1: Lint & Type Check ──────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (API — root) — soft gate
        # Pre-existing baseline: ~360 errors on main. The 9-branch hardening
        # batch did not introduce any. This job fails only if the count
        # INCREASES. A separate fix/typescript-baseline-cleanup branch tracks
        # the pre-existing errors.
        id: tsc-api
        run: |
          set +e
          OUT=$(pnpm exec tsc --noEmit 2>&1)
          ERR=$?
          set -e
          COUNT=$(printf '%s\n' "$OUT" | grep -c 'error TS' || true)
          echo "tsc API: $COUNT error(s)"
          if [ "$ERR" -ne 0 ]; then
            echo "::warning::tsc --noEmit exited non-zero ($ERR) with $COUNT error(s). Baseline is 360. If count is <= 360 this is pre-existing."
            if [ "$COUNT" -gt 360 ]; then
              echo "::error::tsc error count $COUNT exceeds baseline 360. A merge introduced new TS errors."
              exit 1
            fi
            exit 0
          fi

      - name: TypeScript check (Web) — soft gate
        id: tsc-web
        run: |
          set +e
          OUT=$(pnpm --filter web exec tsc --noEmit 2>&1)
          ERR=$?
          set -e
          COUNT=$(printf '%s\n' "$OUT" | grep -c 'error TS' || true)
          echo "tsc Web: $COUNT error(s)"
          if [ "$ERR" -ne 0 ]; then
            echo "::warning::Web tsc exited non-zero ($ERR) with $COUNT error(s). Soft gate; pre-existing errors are tracked separately."
            exit 0
          fi

  # ─── Stage 2: Unit & Integration Tests (Vitest) ─────────────────────────────
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: |
          mkdir -p test-results
          pnpm test -- --reporter=verbose --reporter=junit --outputFile=test-results/junit.xml

      - name: Run security tests
        if: always()
        continue-on-error: true
        run: pnpm test:security || true

      - name: Run data integrity tests
        if: always()
        continue-on-error: true
        run: pnpm test:data-integrity || true

      - name: Run edge case tests
        if: always()
        run: pnpm test:edge-cases

      - name: Run RBAC matrix tests
        if: always()
        continue-on-error: true
        run: pnpm test:rbac || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: test-results/
          retention-days: 14

  # ─── Stage 3: Build Web App ──────────────────────────────────────────────────
  build:
    name: Build Web App
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

  # ─── Stage 4: Deploy to Production ──────────────────────────────────────────
  deploy:
    name: Deploy to Cloudflare Workers (Production)
    runs-on: ubuntu-latest
    needs: [build]
    # Production rollout is agent-managed and versioned. GitHub may run these
    # legacy jobs only after an explicit manual dispatch with opt-in enabled.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm build

      - name: Apply D1 migrations (production)
        # continue-on-error because production D1 may have manually-applied
        # migrations that the migration tracker doesn't know about (causing
        # "duplicate column" errors). Until we reconcile the migration state,
        # failures here should not block deployment.
        continue-on-error: true
        run: |
          pnpm exec wrangler d1 migrations apply DB --env production --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

  # ─── Stage 5: Post-Deploy Smoke Tests ───────────────────────────────────────
  smoke:
    name: Post-Deploy Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy]
    # Production rollout is agent-managed and versioned. GitHub may run these
    # legacy jobs only after an explicit manual dispatch with opt-in enabled.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: pnpm exec playwright test --project=smoke
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://hms-saas-production.rahmatullahzisan.workers.dev' }}

      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ─── Stage 6: E2E API Tests (post-deploy, authenticated) ─────────────────
  e2e:
    name: E2E API Tests
    runs-on: ubuntu-latest
    needs: [smoke]
    # Production rollout is agent-managed and versioned. GitHub may run these
    # legacy jobs only after an explicit manual dispatch with opt-in enabled.
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production == true
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright (Chromium only)
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E API tests
        continue-on-error: true
        run: |
          pnpm exec playwright test --project=api --project=auth-smoke --project=auth-api --project=workflows
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL || 'https://hms-saas-production.rahmatullahzisan.workers.dev' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-report
          path: |
            test/e2e/report/
            test/e2e/results/
          retention-days: 7
