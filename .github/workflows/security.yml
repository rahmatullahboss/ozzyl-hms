name: Security

on:
  # Weekly scheduled scan — Monday 06:00 UTC
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Secret scan (gitleaks) on every push and PR ───────────────────────
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ─── Production dependency audit on every push and PR ─────────────────
  audit:
    name: Dependency audit (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (production)
        # High/critical vulnerabilities fail the job. Lower severities are
        # reported but do not block (so dev-loop PRs aren't blocked by
        # transitive dev-only advisories).
        run: |
          set -e
          if pnpm audit --prod --audit-level=high; then
            echo "No high/critical prod vulnerabilities detected."
          else
            echo "::error::pnpm audit --prod found high/critical vulnerabilities. See log."
            exit 1
          fi
